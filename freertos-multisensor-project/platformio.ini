; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Both environments are defaults, and each does one job:
;   pio run   builds the firmware (bluepill_f103c8); native has nothing to build
;   pio test  runs the unit tests on this computer (native); the STM32 build
;             has no test runner
default_envs = bluepill_f103c8, native

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
monitor_speed = 115200
extra_scripts = pre:extra_script.py
; PlatformIO has no Unity runner for STM32Cube, and running tests on the target
; would need a physical board. The tests run in [env:native] instead.
test_ignore = *
; Static analysis (pio check) of everything built into the firmware.
; unusedFunction is suppressed because PlatformIO runs Cppcheck one file at a
; time, so it cannot see calls between files: every function it flagged is
; called from another module, or from the vector table or the linker (--wrap).
; --inline-suppr keeps the justified `// cppcheck-suppress` comments working.
check_tool = cppcheck
check_src_filters = +<include/> +<src/> +<lib/>
check_flags = cppcheck: --inline-suppr --suppress=unusedFunction

; Host-side unit tests of the hardware-independent decision logic in lib/
; (lab steps 42-44).
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*> ; src/ is STM32 firmware; tests use only lib/
extra_scripts = pre:native_env.py ; lets a plain `pio run` skip this env
; Static analysis of the host-only code: the unit tests. The firmware sources
; are checked in [env:bluepill_f103c8] with the STM32 headers.
check_tool = cppcheck
check_src_filters = +<test/>
check_flags = cppcheck: --inline-suppr --suppress=unusedFunction

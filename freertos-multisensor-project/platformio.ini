; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` builds only the firmware; the native env is for tests.
default_envs = bluepill_f103c8

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
monitor_speed = 115200
extra_scripts = pre:extra_script.py

; Host-side unit tests of hardware-independent code in lib/ (lab step 30):
;   pio test -e native
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*> ; src/ is STM32 firmware; tests use only lib/